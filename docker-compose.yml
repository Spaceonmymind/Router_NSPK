services:
  router-nspk:
    image: node:22-bookworm-slim
    container_name: router-nspk
    restart: unless-stopped
    working_dir: /app
    command:
      - ./node_modules/.bin/vinext
      - start
      - --host
      - 0.0.0.0
      - --port
      - "8090"
    volumes:
      - ./:/app:ro
      - router-wrangler:/app/.wrangler
    ports:
      - "8090:8090"

volumes:
  router-wrangler:
